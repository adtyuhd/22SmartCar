ackermann_command_limiter:
  ros__parameters:
    command_timeout: 0.5
    max_linear_velocity: 0.22
    minimum_turning_radius: 0.6
    use_sim_time: true
behavior_server:
  ros__parameters:
    behavior_plugins:
    - wait
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_footprint
    use_sim_time: true
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 20
    global_frame: map
    odom_topic: /odom
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_wait_action_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_rate_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    robot_base_frame: base_footprint
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Ackermann
      time_steps: 80
      model_dt: 0.05
      batch_size: 3000
      iteration_count: 1
      vx_std: 0.1
      vy_std: 0.0
      wz_std: 0.25
      vx_max: 0.22
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.367
      temperature: 0.3
      gamma: 0.015
      prune_distance: 2.0
      transform_tolerance: 0.2
      visualize: false
      retry_attempt_limit: 1
      regenerate_noises: false
      AckermannConstraints:
        min_turning_r: 0.6
      critics:
      - ConstraintCritic
      - ObstaclesCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.35
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
    progress_checker_plugin: progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.25,-0.15],[-0.25,0.15],[0.25,0.15],[0.25,-0.15]]'
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.02
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.25,-0.15],[-0.25,0.15],[0.25,0.15],[0.25,-0.15]]'
      global_frame: map
      height: 4
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.02
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      use_sim_time: true
      width: 4
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      angle_quantization_bins: 72
      downsample_costmap: false
      max_planning_time: 5.0
      minimum_turning_radius: 0.6
      motion_model_for_search: DUBIN
      plugin: nav2_smac_planner/SmacPlannerHybrid
      smooth_path: true
      tolerance: 0.2
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.35
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    max_velocity:
    - 0.22
    - 0.0
    - 0.6
    min_velocity:
    - 0.0
    - 0.0
    - -0.6
    odom_duration: 0.1
    odom_topic: /odom
    smoothing_frequency: 20.0
    use_sim_time: true
    velocity_timeout: 1.0
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    use_sim_time: true
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 0
    waypoint_task_executor_plugin: wait_at_waypoint
