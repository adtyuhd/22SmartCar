# Explicit scan height bounds: measured sensor is 0.135m above base footprint.
ackermann_command_limiter:
  ros__parameters:
    command_timeout: 0.5
    max_linear_velocity: 0.22
    minimum_turning_radius: 0.6
    use_sim_time: true
behavior_server:
  ros__parameters:
    behavior_plugins:
    - wait
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_footprint
    use_sim_time: true
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 20
    global_frame: map
    odom_topic: /odom
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_wait_action_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_rate_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    robot_base_frame: base_footprint
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.8
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.22
      inflation_cost_scaling_factor: 3.0
      lookahead_dist: 1.5
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_lookahead_dist: 0.5
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.03
      min_lookahead_dist: 0.3
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      transform_tolerance: 0.2
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_interpolation: true
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: false
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.35
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
    progress_checker_plugin: progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.25,-0.15],[-0.25,0.15],[0.25,0.15],[0.25,-0.15]]'
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.02
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.25,-0.15],[-0.25,0.15],[0.25,0.15],[0.25,-0.15]]'
      global_frame: map
      height: 4
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.02
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      use_sim_time: true
      width: 4
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      angle_quantization_bins: 72
      downsample_costmap: false
      max_planning_time: 5.0
      minimum_turning_radius: 0.6
      motion_model_for_search: DUBIN
      plugin: nav2_smac_planner/SmacPlannerHybrid
      smooth_path: true
      tolerance: 0.2
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.35
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    max_velocity:
    - 0.22
    - 0.0
    - 0.6
    min_velocity:
    - 0.0
    - 0.0
    - -0.6
    odom_duration: 0.1
    odom_topic: /odom
    smoothing_frequency: 20.0
    use_sim_time: true
    velocity_timeout: 1.0
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    use_sim_time: true
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 0
    waypoint_task_executor_plugin: wait_at_waypoint
