
# ============================================================
# M3-3 Nav2 导航参数：ROS 2 Humble
# 小车：M3-1 Ackermann Smart Car
# 地图：M3-2 建立的 map.yaml
#
# 当前版本：第一版导航基线，尚未完成实测调优
# ============================================================

# ==================== 1. 行为树导航器 ====================
bt_navigator:
  ros__parameters:
    use_sim_time: true

    # 使用地图坐标系接收全局目标
    global_frame: map

    # 与 M3-1 控制器发布的 TF 对应
    robot_base_frame: base_footprint

    odom_topic: /odom

    # 行为树是导航任务的执行流程
    # 后续使用不包含原地旋转的阿克曼专用行为树
    bt_loop_duration: 10
    default_server_timeout: 20

    # Humble 需要加载行为树所使用的节点插件
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_wait_action_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node


# ==================== 2. 全局规划器 ====================
planner_server:
  ros__parameters:
    use_sim_time: true

    planner_plugins: ["GridBased"]

    # 规划频率要求，单位 Hz
    expected_planner_frequency: 2.0

    GridBased:
      # Humble 中的 Hybrid-A* 插件名称
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # DUBIN：允许前进直行、左转、右转，不规划倒车
      # 适合先验证仅前进的阿克曼车
      motion_model_for_search: "DUBIN"

      # 从车辆轴距 0.28m、最大转角约 30° 计算
      # 理论约 0.485m，取保守基线 0.50m
      minimum_turning_radius: 0.50

      # 将 360° 离散为 72 个朝向，每格 5°
      angle_quantization_bins: 72

      # 不允许将未知地图区域视为可通行
      allow_unknown: false

      # 保持地图原始 0.05m 分辨率，不降采样
      downsample_costmap: false

      # 尽量规划到给定目标，而非接受大范围偏离
      tolerance: 0.20

      # 单次规划最长时间，单位秒
      max_planning_time: 5.0

      # 使用 Hybrid-A* 内置路径平滑
      smooth_path: true


# ==================== 3. 局部控制器 ====================
controller_server:
  ros__parameters:
    use_sim_time: true

    # 20Hz：每 0.05 秒计算一次控制命令
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # 进度检测：判断小车是否长时间卡住
    progress_checker_plugin: "progress_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      # 15 秒内至少移动 0.20m，否则判断进度不足
      required_movement_radius: 0.20
      movement_time_allowance: 15.0

    goal_checker_plugins: ["general_goal_checker"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true

      # 位置允许误差 0.10m：避免距离目标仍有约 0.3m 时提前成功
      xy_goal_tolerance: 0.10

      # 朝向允许误差约 20°
      # 阿克曼车不能原地旋转修正最终朝向
      yaw_goal_tolerance: 0.35

    controller_plugins: ["FollowPath"]

    FollowPath:
      # Humble MPPI 控制器
      plugin: "nav2_mppi_controller::MPPIController"

      # 必须用阿克曼模型，不使用默认 DiffDrive
      motion_model: "Ackermann"

      AckermannConstraints:
        # 必须与 Hybrid-A* 转弯半径一致
        min_turning_r: 0.50

      # ===== MPPI 预测参数 =====

      # 每条候选轨迹预测 40 个时间步
      time_steps: 40

      # 每步 0.05s，总预测时间 2 秒
      # 与 controller_frequency=20Hz 对应
      model_dt: 0.05

      # 每轮生成 1000 条候选轨迹
      # 先兼顾预测质量与 CPU 计算量
      batch_size: 1000

      iteration_count: 1

      # ===== 运动速度限制 =====

      # 最大前进速度 0.30m/s
      # M3-2 已建议较低速度以控制误差
      vx_max: 0.30

      # 禁止产生倒车速度指令
      vx_min: 0.0

      # 阿克曼车不能横向平移
      vy_max: 0.0

      # 由 v/R = 0.30/0.50 得到角速度上界
      wz_max: 0.60

      # ===== 速度采样分布 =====

      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.40

      temperature: 0.30
      gamma: 0.015

      # 暂不发布全部采样轨迹，避免额外计算开销
      visualize: false

      # ===== 轨迹评价函数（Critics） =====

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
        cost_power: 1

      CostCritic:
        enabled: true

        # 结合完整车身 footprint 检查碰撞
        consider_footprint: true
        cost_weight: 3.81
        cost_power: 1

      GoalCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1

      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        cost_power: 1

      PathAlignCritic:
        enabled: true
        cost_weight: 10.0
        cost_power: 1
        # 短路径 (0.8m ≈ 12 点) 必须能激活路径对齐评分
        offset_from_furthest: 4
        # 离目标 0.25m 内交给目标评分；此前默认 0.5m
        threshold_to_consider: 0.25

      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        # 原默认 1.4m 导致整条 0.8m 路径都不参与跟随评分
        threshold_to_consider: 0.25

      PathAngleCritic:
        enabled: true
        cost_weight: 2.0
        cost_power: 1

      PreferForwardCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1


# ==================== 4. 全局代价地图 ====================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      # 与 M3-2 地图保持相同分辨率
      resolution: 0.05

      # 未知区域不能直接当成安全区域
      track_unknown_space: true

      update_frequency: 1.0
      publish_frequency: 1.0

      # 车体长 0.45m，宽 0.22m
      # 额外留出少量几何余量
      footprint: "[[-0.25,-0.15],[-0.25,0.15],[0.25,0.15],[0.25,-0.15]]"

      # 三层：静态地图、雷达障碍、障碍膨胀
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true

          # 实时障碍检测使用近距离数据，降低负载
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        # 待实验验证的初始膨胀半径
        inflation_radius: 0.30

        # 控制代价从障碍附近向外下降的速度
        cost_scaling_factor: 3.0

      # 允许 RViz 订阅完整代价地图
      always_send_full_costmap: true


# ==================== 5. 局部代价地图 ====================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # 使用 map 作为局部代价地图参考系，避免 Humble 控制器
      # 在目标到达判断中将 map 目标转换到 odom 失败时误判成功。
      # 前提是 AMCL 持续提供有效的 map -> odom 动态 TF。
      global_frame: map
      robot_base_frame: base_footprint

      # 以小车为中心实时移动局部地图
      rolling_window: true

      # 4m × 4m 局部观察区域
      width: 4
      height: 4

      resolution: 0.05

      # 与全局地图保持相同的车身外形
      footprint: "[[-0.25,-0.15],[-0.25,0.15],[0.25,0.15],[0.25,-0.15]]"

      # 局部障碍物更新频率比全局地图更高
      update_frequency: 5.0
      publish_frequency: 2.0

      # 包含静态地图，避免仅依赖局部雷达而漏掉地图上的墙体。
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        # 与全局地图保持一致，方便比较
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


# ==================== 6. 路径平滑服务 ====================
smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


# ==================== 7. 恢复行为 ====================
behavior_server:
  ros__parameters:
    use_sim_time: true

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    global_frame: odom
    robot_base_frame: base_footprint

    # 不配置 Spin：阿克曼车不能原地旋转
    # 不配置 BackUp：当前采用仅前进的规划方案
    behavior_plugins: ["wait"]

    wait:
      plugin: "nav2_behaviors/Wait"


# ==================== 8. 路点跟随 ====================
waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: true

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true

      # 任务路点处不额外停留
      waypoint_pause_duration: 0


# ==================== 9. 速度平滑器 ====================
velocity_smoother:
  ros__parameters:
    use_sim_time: true

    # 与控制器保持一致，每秒 20 次
    smoothing_frequency: 20.0

    # 使用命令反馈，不依赖额外速度估计
    feedback: "OPEN_LOOP"

    # 最大速度：[前进速度, 横移速度, 角速度]
    max_velocity: [0.30, 0.0, 0.60]

    # 最小速度：不允许倒车、不允许横移
    min_velocity: [0.0, 0.0, -0.60]

    # 前进加速度和角加速度限制
    max_accel: [0.35, 0.0, 1.0]

    # 减速时的加速度限制
    max_decel: [-0.50, 0.0, -1.0]

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    # 1 秒内收不到新指令则停止
    velocity_timeout: 1.0


# ==================== 10. 地图服务器 ====================
map_server:
  ros__parameters:
    use_sim_time: true

    # 实际 map.yaml 路径由 bringup.launch.py 传入
    # 不在配置中写死任何新地图
    yaml_filename: ""